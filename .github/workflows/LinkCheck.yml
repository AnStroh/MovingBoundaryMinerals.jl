name: Link Check

on:
  push:
    branches:
      - gh-pages

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links in built docs
        uses: lycheeverse/lychee-action@v2
        with:
          # Excludes live in lychee.toml, not here: lychee-action's entrypoint
          # runs this string through `eval`, which strips backslashes and
          # mishandles quotes before lychee ever sees them.
          args: --no-progress --offline --config lychee.toml .
          fail: true
