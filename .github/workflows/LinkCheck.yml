name: Link Check

on:
  push:
    branches:
      - gh-pages

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links in built docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline './**/*.html'
          fail: true
